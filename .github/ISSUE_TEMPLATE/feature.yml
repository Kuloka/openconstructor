name: Idea or feature request
description: Something openconstructor should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you want to get done, e.g. "export my HUD with images to Roblox".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could openconstructor help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Roblox / game UI, Web pages, AI assistant, Export, Apps and oc.db, Editor, Other]
